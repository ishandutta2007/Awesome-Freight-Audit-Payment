<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="1100" height="320" role="img" aria-label="Awesome Freight Audit and Payment — curated SaaS platforms and open-source tools for freight invoice auditing, carrier payment and spend visibility">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1e3d">
        <animate attributeName="stop-color" values="#0b1e3d;#14376e;#0b1e3d" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#14376e">
        <animate attributeName="stop-color" values="#14376e;#0e5d8a;#14376e" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0e5d8a">
        <animate attributeName="stop-color" values="#0e5d8a;#0b1e3d;#0e5d8a" dur="14s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303642"/>
      <stop offset="100%" stop-color="#191d26"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c2942"/>
      <stop offset="100%" stop-color="#101a2e"/>
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="1100" height="320" fill="url(#sky)"/>

  <!-- Twinkling stars -->
  <g fill="#ffffff">
    <circle cx="90" cy="45" r="2" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="210" cy="80" r="1.5" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.15;0.7" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="340" cy="35" r="2.2" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" cy="62" r="1.5" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="4.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="40" r="2" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="70" r="1.6" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.15;0.7" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="30" r="2.1" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.25;0.9" dur="3.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Moon -->
  <circle cx="1000" cy="58" r="26" fill="#ffe9a8" opacity="0.95">
    <animate attributeName="r" values="26;27.5;26" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="991" cy="51" r="24" fill="#14376e" opacity="0.9"/>

  <!-- Aircraft flying across the top -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-180,0;1280,0" dur="26s" repeatCount="indefinite"/>
    <g transform="translate(0,90)">
      <path d="M0 0 L34 -8 L44 0 L34 8 Z" fill="#cfe6ff" opacity="0.85"/>
      <path d="M8 -2 L8 -14 L12 -14 L14 -2 Z" fill="#cfe6ff" opacity="0.85"/>
      <ellipse cx="0" cy="0" rx="9" ry="3" fill="#a8c8e8" opacity="0.7"/>
    </g>
  </g>

  <!-- Ocean band with container ship -->
  <rect x="0" y="188" width="1100" height="62" fill="#0d2c4f" opacity="0.85"/>
  <g transform="translate(130,196)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 180 34; -2 180 34; 0 180 34; 2 180 34; 0 180 34" dur="9s" repeatCount="indefinite"/>
      <!-- Hull -->
      <path d="M60 34 L300 34 L268 62 L96 62 Z" fill="url(#hull)"/>
      <path d="M60 34 L300 34 L290 40 L74 40 Z" fill="#243a5e"/>
      <!-- Containers -->
      <rect x="96" y="12" width="38" height="22" fill="#e2574c"/>
      <rect x="134" y="12" width="38" height="22" fill="#f0c75e"/>
      <rect x="172" y="12" width="38" height="22" fill="#4ca3dd"/>
      <rect x="210" y="12" width="38" height="22" fill="#57b894"/>
      <rect x="248" y="12" width="38" height="22" fill="#e2574c"/>
      <!-- Bridge -->
      <rect x="272" y="14" width="24" height="20" fill="#f0f4f8"/>
      <!-- Funnel -->
      <rect x="296" y="2" width="12" height="18" fill="#1b2a45"/>
    </g>
  </g>

  <!-- Skyline silhouette -->
  <g fill="#0e1526">
    <rect x="0" y="240" width="1100" height="12"/>
    <rect x="60" y="212" width="34" height="28"/>
    <rect x="120" y="224" width="26" height="16"/>
    <rect x="480" y="218" width="40" height="22"/>
    <rect x="540" y="230" width="24" height="10"/>
    <rect x="760" y="210" width="30" height="30"/>
    <rect x="820" y="226" width="22" height="14"/>
    <rect x="900" y="216" width="36" height="24"/>
  </g>

  <!-- Road -->
  <rect x="0" y="250" width="1100" height="70" fill="url(#road)"/>
  <g stroke="#f5d76e" stroke-width="4" stroke-dasharray="30 22" opacity="0.75">
    <line x1="0" y1="285" x2="1100" y2="285">
      <animate attributeName="x1" values="0;-52" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1100;1048" dur="1.4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Truck driving along the road -->
  <g transform="translate(0,6)">
    <animateTransform attributeName="transform" type="translate" values="-360,6;1230,6" dur="17s" repeatCount="indefinite"/>
    <!-- Cargo trailer -->
    <g transform="translate(0,0)">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0" dur="0.9s" repeatCount="indefinite"/>
      <rect x="0" y="-44" width="150" height="52" rx="6" fill="#3f88c5"/>
      <rect x="0" y="-44" width="150" height="52" rx="6" fill="none" stroke="#7ab8e8" stroke-width="2"/>
      <rect x="12" y="-36" width="36" height="36" rx="3" fill="#f7d154" opacity="0.92"/>
      <rect x="58" y="-36" width="36" height="36" rx="3" fill="#e86a5e" opacity="0.92"/>
      <rect x="104" y="-36" width="36" height="36" rx="3" fill="#5cb98c" opacity="0.92"/>
      <g fill="#ffffff" opacity="0.85">
        <circle cx="30" cy="-18" r="8"/>
        <circle cx="76" cy="-18" r="8"/>
        <circle cx="122" cy="-18" r="8"/>
      </g>
      <!-- Trailer wheels -->
      <circle cx="26" cy="12" r="11" fill="#171a21" stroke="#0a0c10" stroke-width="3"/>
      <circle cx="124" cy="12" r="11" fill="#171a21" stroke="#0a0c10" stroke-width="3"/>
    </g>
    <!-- Cab -->
    <g transform="translate(156,-10)">
      <rect x="0" y="-34" width="52" height="46" rx="6" fill="#e8503f"/>
      <rect x="34" y="-34" width="18" height="26" rx="4" fill="#f2f6fa"/>
      <path d="M0 -34 L10 -44 L40 -44 L52 -34 Z" fill="#c23a2c"/>
      <!-- Headlight -->
      <circle cx="52" cy="-8" r="4" fill="#ffe9a8">
        <animate attributeName="opacity" values="1;0.55;1" dur="1.1s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- Cab wheels -->
    <g transform="translate(156,-10)">
      <circle cx="14" cy="12" r="11" fill="#171a21" stroke="#0a0c10" stroke-width="3"/>
      <circle cx="46" cy="12" r="11" fill="#171a21" stroke="#0a0c10" stroke-width="3"/>
    </g>
  </g>

  <!-- Title -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="550" y="96" text-anchor="middle" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="1">
      Awesome Freight Audit &amp; Payment
    </text>
    <text x="550" y="132" text-anchor="middle" font-size="21" font-weight="500" fill="#bfdcff" letter-spacing="0.5">
      Freight invoice auditing &middot; carrier payment &middot; spend visibility &middot; transportation cost control
    </text>
    <text x="550" y="162" text-anchor="middle" font-size="15" font-weight="400" fill="#8fb6e0">
      Curated SaaS platforms &amp; open-source projects &mdash; truckload &middot; LTL &middot; parcel &middot; ocean &middot; air &middot; rail
    </text>
  </g>

  <!-- Pulsing star beside the title -->
  <g transform="translate(78,70)">
    <path d="M0 -14 L4 -4 L14 -4 L6 3 L9 13 L0 7 L-9 13 L-6 3 L-14 -4 L-4 -4 Z" fill="#ffd166">
      <animateTransform attributeName="transform" type="scale" values="1;1.25;1" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
