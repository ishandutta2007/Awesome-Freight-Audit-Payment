<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 1600 700"><title id="title">Freight-Audit-Payment animated banner</title><desc id="desc">An animated logistics finance workflow showing freight, invoice auditing, and payment.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#071a45"/><stop offset=".5" stop-color="#083f8f"/><stop offset="1" stop-color="#087f78"/></linearGradient><linearGradient id="freight" x1="0" x2="1"><stop stop-color="#18a8ff"/><stop offset="1" stop-color="#2875ff"/></linearGradient><linearGradient id="audit" x1="0" x2="1"><stop stop-color="#5b4cff"/><stop offset="1" stop-color="#16b8ff"/></linearGradient><linearGradient id="pay" x1="0" x2="1"><stop stop-color="#00b875"/><stop offset="1" stop-color="#55e36b"/></linearGradient><linearGradient id="route" x1="0" x2="1"><stop stop-color="#25bfff"/><stop offset=".55" stop-color="#5a8cff"/><stop offset="1" stop-color="#48ee82"/></linearGradient><filter id="glow"><feGaussianBlur result="b" stdDeviation="7"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft"><feGaussianBlur stdDeviation="18"/></filter><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path fill="none" stroke="#fff" stroke-opacity=".055" d="M42 0H0V42"/></pattern><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#51e99b" d="M0 0L12 6L0 12Z"/></marker><circle id="packet" r="7" fill="#fff" filter="url(#glow)"><animate attributeName="r" dur="1.2s" repeatCount="indefinite" values="5;9;5"/></circle></defs><rect width="1600" height="700" fill="url(#bg)"/><rect width="1600" height="700" fill="url(#grid)"/><circle cx="180" cy="260" r="190" fill="#18a8ff" filter="url(#soft)" opacity=".12"/><circle cx="1420" cy="390" r="210" fill="#42ed91" filter="url(#soft)" opacity=".12"/><g fill="none" stroke="#7ddcff" stroke-opacity=".2"><path d="M70 180C280 80 430 110 600 185S930 260 1130 155 1420 80 1540 150"/><path d="M120 230C310 160 470 190 620 260S940 335 1150 240 1410 190 1510 240"/></g><g fill="#7ddcff"><circle cx="150" cy="200" r="4"/><circle cx="370" cy="140" r="4"/><circle cx="610" cy="190" r="4"/><circle cx="930" cy="250" r="4"/><circle cx="1190" cy="175" r="4"/><circle cx="1450" cy="145" r="4"/></g><text x="800" y="82" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="55" font-weight="800" letter-spacing="-1" text-anchor="middle">Freight-<tspan fill="#42c7ff">Audit</tspan>-<tspan fill="#52ee91">Payment</tspan></text><text x="800" y="118" fill="#d5e9ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="6" text-anchor="middle">SHIP • VERIFY • PAY • MOVE FORWARD</text><g font-family="Inter,Segoe UI,Arial,sans-serif"><g transform="translate(90 155)"><rect width="390" height="125" fill="url(#freight)" stroke="#66d5ff" stroke-width="2" rx="25"/><circle cx="65" cy="62" r="35" fill="#fff" opacity=".14"/><path fill="#fff" d="M40 65h52v18H40zM52 52h24v13H52zM92 70h15v13H92z"/><circle cx="52" cy="86" r="7" fill="#fff"/><circle cx="96" cy="86" r="7" fill="#fff"/><text x="125" y="54" fill="#fff" font-size="29" font-weight="800">Freight</text><text x="125" y="82" fill="#e5f8ff" font-size="15">Shipments delivered.</text></g><g transform="translate(605 155)"><rect width="390" height="125" fill="url(#audit)" stroke="#9f9aff" stroke-width="2" rx="25"/><circle cx="65" cy="62" r="35" fill="#fff" opacity=".14"/><circle cx="61" cy="58" r="19" fill="none" stroke="#fff" stroke-width="6"/><path stroke="#fff" stroke-linecap="round" stroke-width="7" d="M75 72l18 18"/><text x="125" y="54" fill="#fff" font-size="29" font-weight="800">Audit</text><text x="125" y="82" fill="#eef0ff" font-size="15">Invoices checked.</text></g><g transform="translate(1120 155)"><rect width="390" height="125" fill="url(#pay)" stroke="#7dff9a" stroke-width="2" rx="25"/><circle cx="65" cy="62" r="35" fill="#fff" opacity=".14"/><rect width="52" height="38" x="39" y="46" fill="#fff" rx="7"/><path stroke="#1fc879" stroke-width="6" d="M40 58h51"/><circle cx="78" cy="70" r="5" fill="#1fc879"/><text x="125" y="54" fill="#fff" font-size="29" font-weight="800">Payment</text><text x="125" y="82" fill="#eaffee" font-size="15">Approved. Paid.</text></g></g><g fill="none" stroke="url(#route)" stroke-linecap="round" stroke-width="7" marker-end="url(#arrow)"><path d="M480 217C535 217 550 217 605 217"><animate attributeName="stroke-dasharray" dur="1.5s" repeatCount="indefinite" values="1 120;120 1"/></path><path d="M995 217C1050 217 1065 217 1120 217"><animate attributeName="stroke-dasharray" dur="1.5s" repeatCount="indefinite" values="1 120;120 1"/></path></g><path fill="none" stroke="#3ee8a0" stroke-opacity=".18" stroke-width="25" d="M80 540 C300 380 430 590 620 455 S930 350 1110 500 S1360 570 1510 420" filter="url(#glow)"/><path id="mainRoute" fill="none" stroke="url(#route)" stroke-dasharray="18 16" stroke-linecap="round" stroke-width="6" d="M80 540 C300 380 430 590 620 455 S930 350 1110 500 S1360 570 1510 420"><animate attributeName="stroke-dashoffset" dur="2s" from="0" repeatCount="indefinite" to="-68"/></path><use href="#packet"><animateMotion dur="5.5s" repeatCount="indefinite" rotate="auto"><mpath href="#mainRoute"/></animateMotion></use><g transform="translate(110 445)"><rect width="175" height="62" x="0" y="34" fill="#1475d1" rx="7"/><rect width="70" height="43" x="14" y="44" fill="#f28b24"/><rect width="70" height="43" x="91" y="44" fill="#24b6e9"/><path fill="#1d9bff" d="M175 52h43l28 30v14h-71z"/><circle cx="47" cy="103" r="17" fill="#0a214b"/><circle cx="47" cy="103" r="8" fill="#a9d6ee"/><circle cx="206" cy="103" r="17" fill="#0a214b"/><circle cx="206" cy="103" r="8" fill="#a9d6ee"/><animateTransform attributeName="transform" dur="2.4s" repeatCount="indefinite" type="translate" values="110 445;125 445;110 445"/></g><g transform="translate(545 335)"><rect 