<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Freight-Audit-Payment animated banner</title>
  <desc id="desc">An animated logistics finance workflow showing freight, invoice auditing, and payment.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a45"/>
      <stop offset=".5" stop-color="#083f8f"/>
      <stop offset="1" stop-color="#087f78"/>
    </linearGradient>
    <linearGradient id="freight" x1="0" x2="1">
      <stop stop-color="#18a8ff"/><stop offset="1" stop-color="#2875ff"/>
    </linearGradient>
    <linearGradient id="audit" x1="0" x2="1">
      <stop stop-color="#5b4cff"/><stop offset="1" stop-color="#16b8ff"/>
    </linearGradient>
    <linearGradient id="pay" x1="0" x2="1">
      <stop stop-color="#00b875"/><stop offset="1" stop-color="#55e36b"/>
    </linearGradient>
    <linearGradient id="route" x1="0" x2="1">
      <stop stop-color="#25bfff"/><stop offset=".55" stop-color="#5a8cff"/><stop offset="1" stop-color="#48ee82"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#fff" stroke-opacity=".055"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#51e99b"/>
    </marker>

    <!-- Moving light along route -->
    <circle id="packet" r="7" fill="#fff" filter="url(#glow)">
      <animate attributeName="r" values="5;9;5" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </defs>

  <!-- Background -->
  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#grid)"/>
  <circle cx="180" cy="260" r="190" fill="#18a8ff" opacity=".12" filter="url(#soft)"/>
  <circle cx="1420" cy="390" r="210" fill="#42ed91" opacity=".12" filter="url(#soft)"/>

  <!-- Decorative world/network -->
  <g fill="none" stroke="#7ddcff" stroke-opacity=".2">
    <path d="M70 180C280 80 430 110 600 185S930 260 1130 155 1420 80 1540 150"/>
    <path d="M120 230C310 160 470 190 620 260S940 335 1150 240 1410 190 1510 240"/>
  </g>
  <g fill="#7ddcff">
    <circle cx="150" cy="200" r="4"/><circle cx="370" cy="140" r="4"/>
    <circle cx="610" cy="190" r="4"/><circle cx="930" cy="250" r="4"/>
    <circle cx="1190" cy="175" r="4"/><circle cx="1450" cy="145" r="4"/>
  </g>

  <!-- Header -->
  <text x="800" y="82" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="55" font-weight="800" fill="#fff" letter-spacing="-1">
    Freight-<tspan fill="#42c7ff">Audit</tspan>-<tspan fill="#52ee91">Payment</tspan>
  </text>
  <text x="800" y="118" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="15" font-weight="700" fill="#d5e9ff" letter-spacing="6">
    SHIP  •  VERIFY  •  PAY  •  MOVE FORWARD
  </text>

  <!-- Workflow cards -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(90 155)">
      <rect width="390" height="125" rx="25" fill="url(#freight)" stroke="#66d5ff" stroke-width="2"/>
      <circle cx="65" cy="62" r="35" fill="#fff" opacity=".14"/>
      <path d="M40 65h52v18H40zM52 52h24v13H52zM92 70h15v13H92z" fill="#fff"/>
      <circle cx="52" cy="86" r="7" fill="#fff"/><circle cx="96" cy="86" r="7" fill="#fff"/>
      <text x="125" y="54" font-size="29" font-weight="800" fill="#fff">Freight</text>
      <text x="125" y="82" font-size="15" fill="#e5f8ff">Shipments delivered.</text>
    </g>

    <g transform="translate(605 155)">
      <rect width="390" height="125" rx="25" fill="url(#audit)" stroke="#9f9aff" stroke-width="2"/>
      <circle cx="65" cy="62" r="35" fill="#fff" opacity=".14"/>
      <circle cx="61" cy="58" r="19" fill="none" stroke="#fff" stroke-width="6"/>
      <path d="M75 72l18 18" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
      <text x="125" y="54" font-size="29" font-weight="800" fill="#fff">Audit</text>
      <text x="125" y="82" font-size="15" fill="#eef0ff">Invoices checked.</text>
    </g>

    <g transform="translate(1120 155)">
      <rect width="390" height="125" rx="25" fill="url(#pay)" stroke="#7dff9a" stroke-width="2"/>
      <circle cx="65" cy="62" r="35" fill="#fff" opacity=".14"/>
      <rect x="39" y="46" width="52" height="38" rx="7" fill="#fff"/>
      <path d="M40 58h51" stroke="#1fc879" stroke-width="6"/>
      <circle cx="78" cy="70" r="5" fill="#1fc879"/>
      <text x="125" y="54" font-size="29" font-weight="800" fill="#fff">Payment</text>
      <text x="125" y="82" font-size="15" fill="#eaffee">Approved. Paid.</text>
    </g>
  </g>

  <!-- Animated workflow arrows -->
  <g fill="none" stroke="url(#route)" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M480 217C535 217 550 217 605 217">
      <animate attributeName="stroke-dasharray" values="1 120;120 1" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M995 217C1050 217 1065 217 1120 217">
      <animate attributeName="stroke-dasharray" values="1 120;120 1" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Main animated route -->
  <path d="M80 540 C300 380 430 590 620 455 S930 350 1110 500 S1360 570 1510 420"
        fill="none" stroke="#3ee8a0" stroke-opacity=".18" stroke-width="25" filter="url(#glow)"/>
  <path id="mainRoute"
        d="M80 540 C300 380 430 590 620 455 S930 350 1110 500 S1360 570 1510 420"
        fill="none" stroke="url(#route)" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="18 16">
    <animate attributeName="stroke-dashoffset" from="0" to="-68" dur="2s" repeatCount="indefinite"/>
  </path>
  <use href="#packet">
    <animateMotion dur="5.5s" repeatCount="indefinite" rotate="auto">
      <mpath href="#mainRoute"/>
    </animateMotion>
  </use>

  <!-- Freight visual -->
  <g transform="translate(110 445)">
    <rect x="0" y="34" width="175" height="62" rx="7" fill="#1475d1"/>
    <rect x="14" y="44" width="70" height="43" fill="#f28b24"/>
    <rect x="91" y="44" width="70" height="43" fill="#24b6e9"/>
    <path d="M175 52h43l28 30v14h-71z" fill="#1d9bff"/>
    <circle cx="47" cy="103" r="17" fill="#0a214b"/><circle cx="47" cy="103" r="8" fill="#a9d6ee"/>
    <circle cx="206" cy="103" r="17" fill="#0a214b"/><circle cx="206" cy="103" r="8" fill="#a9d6ee"/>
    <animateTransform attributeName="transform" type="translate" values="110 445;125 445;110 445" dur="2.4s" repeatCount="indefinite"/>
  </g>

  <!-- Invoice / audit panel -->
  <g transform="translate(545 335)">
    <rect width="390" height="190" rx="22" fill="#071d55" fill-opacity=".88" stroke="#42c8ff" stroke-width="2"/>
    <text x="28" y="38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#fff">AI AUDIT ENGINE</text>
    <text x="28" y="61" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#9cc9ed">Invoice • Rate • Accessorials • Fuel • Tax</text>

    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#dff4ff">
      <g transform="translate(30 82)">
        <circle cx="8" cy="8" r="8" fill="#43df82"/>
        <path d="M4 8l3 3 6-7" fill="none" stroke="#073a38" stroke-width="2"/>
        <text x="28" y="13">Rate match</text>
      </g>
      <g transform="translate(30 112)">
        <circle cx="8" cy="8" r="8" fill="#43df82"/>
        <path d="M4 8l3 3 6-7" fill="none" stroke="#073a38" stroke-width="2"/>
        <text x="28" y="13">Accessorials</text>
      </g>
      <g transform="translate(30 142)">
        <circle cx="8" cy="8" r="8" fill="#43df82"/>
        <path d="M4 8l3 3 6-7" fill="none" stroke="#073a38" stroke-width="2"/>
        <text x="28" y="13">Fuel surcharge</text>
      </g>
      <g transform="translate(220 82)">
        <circle cx="8" cy="8" r="8" fill="#43df82"/>
        <path d="M4 8l3 3 6-7" fill="none" stroke="#073a38" stroke-width="2"/>
        <text x="28" y="13">Detention</text>
      </g>
      <g transform="translate(220 112)">
        <circle cx="8" cy="8" r="8" fill="#43df82"/>
        <path d="M4 8l3 3 6-7" fill="none" stroke="#073a38" stroke-width="2"/>
        <text x="28" y="13">Taxes &amp; fees</text>
      </g>
    </g>

    <!-- Animated audit scan -->
    <rect x="20" y="72" width="350" height="2" fill="#55dfff" opacity=".8">
      <animate attributeName="y" values="72;166;72" dur="2.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Payment confirmation -->
  <g transform="translate(1130 340)">
    <rect width="280" height="180" rx="25" fill="#effff7" stroke="#50ee91" stroke-width="4"/>
    <circle cx="140" cy="65" r="34" fill="#29d77d">
      <path d="M121 65l12 12 28-32" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <animate attributeName="r" values="30;36;30" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="140" y="122" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif"
          font-size="20" font-weight="900" fill="#073d35">PAYMENT COMPLETED</text>
    <text x="140" y="148" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif"
          font-size="12" fill="#4c7771">Verified • Approved • Settled</text>
  </g>

  <!-- Flowing payment particles -->
  <g fill="#ffd34e" filter="url(#glow)">
    <circle r="6">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M1040 510 C1130 520 1200 470 1280 455"/>
    </circle>
    <circle r="4">
      <animateMotion dur="2.7s" begin=".7s" repeatCount="indefinite" path="M1020 485 C1130 500 1190 450 1320 435"/>
    </circle>
    <circle r="5">
      <animateMotion dur="3.8s" begin="1.1s" repeatCount="indefinite" path="M1040 530 C1160 550 1270 500 1380 450"/>
    </circle>
  </g>

  <!-- Footer metrics -->
  <g transform="translate(0 605)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="55" y="0" width="1490" height="67" rx="18" fill="#04183f" fill-opacity=".65" stroke="#5dbdff" stroke-opacity=".22"/>
    <g fill="#dff4ff" font-size="14" font-weight="700">
      <text x="115" y="40">⚡ Faster Turnaround</text>
      <text x="410" y="40">✓ Higher Accuracy</text>
      <text x="710" y="40">↓ Lower Costs</text>
      <text x="990" y="40">↗ Clean Cash Flow</text>
      <text x="1290" y="40">◎ Stronger Supply Chains</text>
    </g>
  </g>

  <!-- Subtle title pulse -->
  <text x="800" y="82" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="55" font-weight="800" fill="none" stroke="#fff" stroke-opacity=".08">
    Freight-Audit-Payment
    <animate attributeName="stroke-opacity" values=".03;.16;.03" dur="3s" repeatCount="indefinite"/>
  </text>
</svg>
