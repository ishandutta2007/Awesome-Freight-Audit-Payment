ont-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="900" text-anchor="middle">PAYMENT COMPLETED</text><text x="140" y="148" fill="#4c7771" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle">Verified • Approved • Settled</text></g><g fill="#ffd34e" filter="url(#glow)"><circle r="6"><animateMotion dur="3.2s" path="M1040 510 C1130 520 1200 470 1280 455" repeatCount="indefinite"/></circle><circle r="4"><animateMotion begin=".7s" dur="2.7s" path="M1020 485 C1130 500 1190 450 1320 435" repeatCount="indefinite"/></circle><circle r="5"><animateMotion begin="1.1s" dur="3.8s" path="M1040 530 C1160 550 1270 500 1380 450" repeatCount="indefinite"/></circle></g><g font-family="Inter,Segoe UI,Arial,sans-serif" transform="translate(0 605)"><rect width="1490" height="67" x="55" y="0" fill="#04183f" fill-opacity=".65" stroke="#5dbdff" stroke-opacity=".22" rx="18"/><g fill="#dff4ff" font-size="14" font-weight="700"><text x="115" y="40">⚡ Faster Turnaround</text><text x="410" y="40">✓ Higher Accuracy</text><text x="710" y="40">↓ Lower Costs</text><text x="990" y="40">↗ Clean Cash Flow</text><text x="1290" y="40">◎ Stronger Supply Chains</text></g></g><text x="800" y="82" fill="none" stroke="#fff" stroke-opacity=".08" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="55" font-weight="800" text-anchor="middle">Freight-Audit-Payment <animate attributeName="stroke-opacity" dur="3s" repeatCount="indefinite" values=".03;.16;.03"/></text></svg>